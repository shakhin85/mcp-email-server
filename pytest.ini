# pytest.ini
[pytest]
# pytest.ini overrides pyproject [tool.pytest.ini_options] entirely — keep
# testpaths here too, or pytest collects the whole repo (scratchpad/ included).
testpaths = tests
asyncio_mode = auto
addopts = -m "not e2e"
markers =
    e2e: requires the repository GreenMail Docker service and exercises real SMTP/IMAP sockets
# asyncio_default_fixture_loop_scope =
